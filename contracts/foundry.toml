[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
code_size_limit = 100000
libs = ["../node_modules"]
fs_permissions = [{access = "read-write", path = "../deployments"}]
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/", "@uniswap/v4-core/=../node_modules/@uniswap/v4-core/", "@uniswap/v4-periphery/=../node_modules/@uniswap/v4-periphery/", "forge-std/=../node_modules/@uniswap/v4-core/lib/forge-std/src/"]

[fuzz]
runs = 64
